name: vlearn-labspace

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vlearn_labspace}
      POSTGRES_USER: ${POSTGRES_USER:-vlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_API_PREFIX: /api/v1
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_CORS_ORIGINS: https://labspace.torome.online
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vlearn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vlearn_labspace}
      DATABASE_ECHO: "false"
      DATABASE_AUTO_CREATE: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - private
      - edge

  web:
    build:
      context: ./frontend
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-http}
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: auto
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    ports:
      - 127.0.0.1:${APP_PORT:-18080}:80
    networks:
      - private
      - edge

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ../.cloudflared/4df41506-15c1-44b3-b6e3-a757f6754eff.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      web:
        condition: service_healthy
        restart: true
    networks:
      - edge

volumes:
  postgres_data:
  app_data:

networks:
  private:
    internal: true
  edge:
